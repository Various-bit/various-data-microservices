events {
    worker_connections 1024;
}

http {

    upstream auth-service {
        server authorization-ms:8080;
        keepalive 32;
    }

    upstream authority-service {
            server subscribe-ms:8080;
            keepalive 32;
        }

    upstream comment {
        server comment-ms:8080;
    }

    upstream report {
        server report-ms:8080;
    }

    upstream scrap {
        server scrap-ms:8080;
    }

    upstream tracker {
        server tracker-ms:8080;
    }

    server {
        listen 80;

        set $cors_origin "http://localhost:5173";


        location /api/scrap/product {
            add_header 'Access-Control-Allow-Origin' $cors_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,Accept,Origin,User-Agent,DNT,Cache-Control,X-Mx-ReqToken,Keep-Alive,X-Requested-With';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Access-Control-Expose-Headers' 'Content-Length';
            add_header 'Access-Control-Max-Age' 3600;
            if ($request_method = "OPTIONS") {
                return 204;
            }

            auth_request /auth-validate;
            auth_request_set $user_uuid $upstream_http_x_uuid;
            auth_request_set $username $upstream_http_x_username;
            auth_request_set $authority $upstream_http_x_authority;
            auth_request_set $email $upstream_http_x_email;

            proxy_set_header X-UUID $user_uuid;
            proxy_set_header X-Username $username;
            proxy_set_header X-Authority $authority;
            proxy_set_header X-Email $email;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://scrap/api/scrap/product;
        }

